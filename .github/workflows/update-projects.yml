name: Update profile projects

on:
  schedule:
    - cron: "17 5 * * 1" # Every Monday at 05:17 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-projects.yml"
      - "scripts/update_projects.py"

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update the generated project list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Yassine-Jemi01
          PROFILE_REPO: Yassine-Jemi01
        run: python scripts/update_projects.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh profile projects"
          git push
